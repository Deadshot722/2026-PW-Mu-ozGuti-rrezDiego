<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Registrar Asistencia - CECyT 9</title>
</head>

<body>

<header>
    <a href="./detalle.html">
        Volver al detalle del taller
    </a>
</header>

<form class="formulario-registro" id="form-registro">

    <h1>Formulario de registro de asistencia</h1>

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error" id="error-nombre"></span>

    <label for="boleta">Número de boleta</label>
    <input type="text" id="boleta" name="boleta" required>
    <span class="error" id="error-boleta"></span>

    <button type="submit">
        Registrar asistencia
    </button>

    <p id="mensaje-error"></p>
    <p id="mensaje-exito"></p>

</form>

<script src="../01 validaciones/validaciones.js"></script>

</body>
</html>
